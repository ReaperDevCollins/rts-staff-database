<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | RTS Staff Database</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="topbar">

    <div class="logo">

        <img
            src="rts-logo.png"
            class="rts-logo"
            alt="RTS Logo"
        >

        <span>
            RTS Staff Database
        </span>

    </div>

</header>


<main class="page">

    <section class="login-container">

        <div class="login-card">

            <img
                src="rts-logo.png"
                class="login-logo"
                alt="RTS Logo"
            >

            <p class="section-label">
                ACCOUNT SECURITY
            </p>

            <h1>
                Set New Password
            </h1>

            <p>
                Enter a new password for your
                RTS Staff Database account.
            </p>


            <form id="resetPasswordForm">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm New Password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                >
                    Update Password
                </button>


                <p
                    id="resetPasswordMessage"
                    class="login-error"
                ></p>

            </form>

        </div>

    </section>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://aqrqfbwktwdhpfvcethy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_yx-KgW6xvRxogF-CSLYVfg_uM6Hh7ws";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const form =
    document.getElementById(
        "resetPasswordForm"
    );


const message =
    document.getElementById(
        "resetPasswordMessage"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const password =
            document.getElementById(
                "newPassword"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        message.textContent = "";


        if (
            password.length < 6
        ) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }


        if (
            password !== confirmPassword
        ) {

            message.textContent =
                "The passwords do not match.";

            return;

        }


        const button =
            form.querySelector(
                "button[type='submit']"
            );


        button.disabled = true;

        button.textContent =
            "Updating...";


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .updateUser({
                        password:
                            password
                    });


            if (error) {

                message.textContent =
                    error.message;

                return;

            }


            message.style.color =
                "green";


            message.textContent =
                "Password updated successfully. Redirecting...";


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                1500
            );

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Unable to update your password.";

        }

        finally {

            button.disabled = false;

            button.textContent =
                "Update Password";

        }

    }
);

</script>

</body>

</html>
